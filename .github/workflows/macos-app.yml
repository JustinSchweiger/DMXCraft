# macOS app bundle + install notes for every release.
#
# Runs automatically for every version tag (same trigger as release.yml).
# cargo-dist only ships the bare binary for macOS, which opens through the
# Terminal. This workflow builds a proper universal app bundle (Apple Silicon
# and Intel), uploads it as a DMG once cargo-dist has created the release and
# puts install instructions for all platforms at the top of the release notes
# (.github/release-install.md).
#
# For an existing release: "Run workflow" with the tag.

name: macOS-App

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.4.1"
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Rust
        run: |
          rustup update stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build (Apple Silicon + Intel)
        run: |
          cargo build --release --locked -p dmxcraft --target aarch64-apple-darwin
          cargo build --release --locked -p dmxcraft --target x86_64-apple-darwin

      - name: App bundle
        run: |
          VERSION="${TAG#v}"
          APP="dist/DMXCraft.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/dmxcraft" \
            target/aarch64-apple-darwin/release/dmxcraft \
            target/x86_64-apple-darwin/release/dmxcraft

          # Icon from icon-512.png
          ICONSET=dist/DMXCraft.iconset
          mkdir -p "$ICONSET"
          SRC=crates/app/assets/icon-512.png
          for s in 16 32 128 256 512; do
            sips -z $s $s "$SRC" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
          done
          for s in 16 32 128 256; do
            d=$((s * 2))
            sips -z $d $d "$SRC" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/DMXCraft.icns"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>DMXCraft</string>
            <key>CFBundleDisplayName</key><string>DMXCraft</string>
            <key>CFBundleIdentifier</key><string>de.justinschweiger.dmxcraft</string>
            <key>CFBundleExecutable</key><string>dmxcraft</string>
            <key>CFBundleIconFile</key><string>DMXCraft</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          sed -i '' 's/^          //' "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"

          # Ad-hoc signature (no notarization without an Apple developer account)
          codesign --force --deep --sign - "$APP"

      - name: DMG
        run: |
          mkdir -p dist/dmg
          cp -R dist/DMXCraft.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname DMXCraft -srcfolder dist/dmg -ov -format UDZO \
            "dist/DMXCraft-macos-universal.dmg"

      - name: Wait for the release and upload
        run: |
          # cargo-dist creates the release only at the end of its builds
          for i in $(seq 1 120); do
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/DMXCraft-macos-universal.dmg \
                -R "$GITHUB_REPOSITORY" --clobber
              exit 0
            fi
            sleep 30
          done
          echo "Release $TAG not found" >&2
          exit 1

      - name: Install notes
        run: |
          MARK="<!-- dmxcraft-install -->"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body > dist/body.md
          if grep -qF "$MARK" dist/body.md; then
            # Replace the block from a previous run
            awk -v m="$MARK" 'f==0 && index($0,m){f=1;next} f==1 && index($0,m){f=2;next} f!=1' dist/body.md | sed '/./,$!d' > dist/rest.md
          else
            cp dist/body.md dist/rest.md
          fi
          {
            echo "$MARK"
            sed "s/{TAG}/$TAG/g; s/{VERSION}/${TAG#v}/g" .github/release-install.md
            echo "$MARK"
            echo
            cat dist/rest.md
          } > dist/notes.md
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file dist/notes.md
