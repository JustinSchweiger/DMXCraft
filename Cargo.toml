[workspace]
resolver = "2"
members = ["crates/core", "crates/output", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
openlicht-core = { path = "crates/core" }
openlicht-output = { path = "crates/output" }
