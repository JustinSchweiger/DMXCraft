[workspace]
resolver = "2"
members = ["crates/core", "crates/output", "crates/ofl", "crates/mcp", "crates/app"]

[workspace.package]
version = "0.4.3"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/JustinSchweiger/DMXCraft"
homepage = "https://github.com/JustinSchweiger/DMXCraft"
authors = ["Justin Schweiger"]
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dmxcraft-core = { path = "crates/core" }
dmxcraft-output = { path = "crates/output" }
dmxcraft-ofl = { path = "crates/ofl" }
dmxcraft-mcp = { path = "crates/mcp" }

# Release profile for the installers (used by dist)
[profile.dist]
inherits = "release"
lto = "thin"
strip = true
