<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DMXCraft">
<meta name="theme-color" content="#16181c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<title>DMXCraft</title>
<style>
  @font-face { font-family: "DMXText"; src: url("/fonts/text.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "DMXIcons"; src: url("/fonts/icons.ttf") format("truetype"); font-display: block; }
  :root {
    --bg: #16181c; --surface: #1d2025; --raised: #272b31; --border: #353a42;
    --accent: #3d8bfd; --text: #e8eaed; --dim: #9aa0a8; --danger: #e5484d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "DMXText", system-ui, sans-serif; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--surface);
    border-bottom: 1px solid var(--border); min-height: 48px; }
  #title { font-size: 14px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 30%; display: flex; align-items: center; gap: 6px; }
  #dot { width: 8px; height: 8px; border-radius: 4px; background: var(--danger); flex: none; }
  #dot.ok { background: #30a46c; }
  #tabs { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; border: 1px solid var(--border); background: var(--raised); color: var(--text);
    font: inherit; font-size: 15px; padding: 0 16px; height: 36px; border-radius: 8px; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #fff); }
  .ibtn { flex: none; width: 40px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--raised); color: var(--text); font-family: "DMXIcons"; font-size: 20px; }
  main { position: relative; flex: 1; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; touch-action: none; display: block; }
  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; text-align: center; padding: 24px; color: var(--dim); font-size: 16px; }
  #msg.show { display: flex; }
  #msgtext { white-space: pre-line; }
  /* Verbindung weg: Bedienfläche unscharf und gesperrt */
  #msg.offline { background: rgba(0, 0, 0, 0.45); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: #fff; font-size: 18px; }
  #msg.offline::before { content: ""; width: 44px; height: 44px; border-radius: 50%;
    border: 4px solid rgba(255, 255, 255, 0.25); border-top-color: var(--danger); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #pin { display: none; flex-direction: column; gap: 10px; align-items: center; }
  #pin.show { display: flex; }
  #pin input { font: inherit; font-size: 28px; letter-spacing: 6px; text-align: center; width: 200px;
    padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  #pin button { font: inherit; font-size: 17px; padding: 10px 28px; border-radius: 8px; border: 0;
    background: var(--accent); color: var(--on-accent, #fff); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="title"><span id="dot"></span><span id="name">DMXCraft</span></div>
    <div id="tabs"></div>
    <button class="ibtn" id="full" title="Vollbild">&#xE1D0;</button>
  </header>
  <main id="main">
    <canvas id="cv"></canvas>
    <div id="msg" class="show">
      <span id="msgtext">Verbinde …</span>
      <form id="pin">
        <input id="pinval" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
        <button type="submit" id="pinok">OK</button>
      </form>
    </div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
