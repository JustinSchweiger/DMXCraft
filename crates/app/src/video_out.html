<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DMXCraft video output</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0;
  }
</style>
</head>
<body>
<script>
// Follows DMXCraft's clock: small deviations are evened out with the speed,
// only large ones seek (every seek is a visible jump).
const POLL_MS = 100;
const SEEK_MS = 400;     // further off than this: seek
const PAUSED_MS = 40;    // paused: show the exact frame
const players = new Map(); // key -> { el, media, drift, strikes, seeking }

function player(c) {
  let p = players.get(c.key);
  if (p && p.media !== c.media) { drop(c.key); p = null; }
  if (!p) {
    const el = document.createElement('video');
    el.preload = 'auto';
    el.playsInline = true;
    el.muted = true;
    el.src = '/media/' + c.media;
    p = { el, media: c.media, drift: 0, strikes: 0 };
    el.addEventListener('error', () => {
      const e = el.error;
      fetch('/error', {
        method: 'POST',
        body: JSON.stringify({ media: c.media, message: e ? (e.code + ': ' + (e.message || '')) : '' }),
      }).catch(() => {});
    });
    el.currentTime = c.pos / 1000;
    document.body.appendChild(el);
    players.set(c.key, p);
  }
  return p;
}

function drop(key) {
  const p = players.get(key);
  if (!p) return;
  p.el.pause();
  p.el.removeAttribute('src');
  p.el.load();
  p.el.remove();
  players.delete(key);
}

function seek(p, ms) {
  p.el.currentTime = Math.max(0, ms) / 1000;
  p.drift = 0;
  p.strikes = 0;
}

function apply(c, latency) {
  const p = player(c);
  const el = p.el;
  el.style.zIndex = c.z;
  el.style.opacity = c.preload ? 0 : c.opacity;
  const vol = Math.max(0, Math.min(1, c.volume));
  el.muted = vol <= 0.001;
  el.volume = vol;
  if (c.preload || c.rate <= 0) {
    if (!el.paused) el.pause();
    if (Math.abs(el.currentTime * 1000 - c.pos) > PAUSED_MS && !el.seeking) seek(p, c.pos);
    return;
  }
  // where DMXCraft is now (the answer took a moment)
  const target = c.pos + latency * c.rate;
  if (el.paused) {
    seek(p, target);
    el.playbackRate = c.rate;
    el.play().catch(() => {});
    return;
  }
  if (el.seeking || el.readyState < 3) return;
  const raw = el.currentTime * 1000 - target;
  if (Math.abs(raw) > SEEK_MS) {
    // twice in a row: a real jump, not a hiccup
    if (++p.strikes >= 2) seek(p, target + 120 * c.rate);
    return;
  }
  p.strikes = 0;
  p.drift = p.drift * 0.7 + raw * 0.3;
  // catch up within about a second, at most 8 % faster or slower
  const k = Math.max(-0.08, Math.min(0.08, -p.drift / 1000));
  const rate = c.rate * (1 + (Math.abs(p.drift) < 8 ? 0 : k));
  if (Math.abs(el.playbackRate - rate) > 0.001) el.playbackRate = rate;
}

async function poll() {
  const t0 = performance.now();
  try {
    const r = await fetch('/state', { cache: 'no-store' });
    const s = await r.json();
    const latency = (performance.now() - t0) / 2;
    const keys = new Set();
    for (const c of s.clips) {
      keys.add(c.key);
      apply(c, latency);
    }
    for (const k of [...players.keys()]) if (!keys.has(k)) drop(k);
  } catch (e) {
    // DMXCraft closed: show nothing
    for (const k of [...players.keys()]) drop(k);
  }
  setTimeout(poll, Math.max(0, POLL_MS - (performance.now() - t0)));
}
poll();
</script>
</body>
</html>
