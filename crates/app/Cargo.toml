[package]
name = "dmxcraft"
description = "Desktop-Oberfläche (egui) für DMXCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "CB2B5339-63EE-43B8-B89A-B8D9AB9C73FA"
path-guid = "7F85799B-9B06-4165-9EB6-224E0AFA4AE8"
license = false
eula = false

[[bin]]
name = "dmxcraft"
path = "src/main.rs"

[dependencies]
dmxcraft-core.workspace = true
dmxcraft-output.workspace = true
dmxcraft-ofl.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
rfd = "0.17"
axoupdater = { version = "0.10", features = ["blocking"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-wav", "symphonia-pcm", "symphonia-flac", "symphonia-vorbis", "symphonia-ogg", "symphonia-aac", "symphonia-isomp4"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
