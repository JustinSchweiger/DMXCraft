[package]
name = "dmxcraft"
default-run = "dmxcraft"
description = "Desktop interface (egui) for DMXCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "CB2B5339-63EE-43B8-B89A-B8D9AB9C73FA"
path-guid = "7F85799B-9B06-4165-9EB6-224E0AFA4AE8"
license = false
eula = false

[[bin]]
name = "dmxcraft"
path = "src/main.rs"

# stdio bridge for MCP clients (does not lock dmxcraft.exe)
[[bin]]
name = "dmxcraft-mcp"
path = "src/bin/dmxcraft-mcp.rs"

[dependencies]
dmxcraft-core.workspace = true
dmxcraft-output.workspace = true
dmxcraft-ofl.workspace = true
dmxcraft-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false }
sha2 = "0.11"
rfd = "0.17"
glam = { version = "0.30", features = ["bytemuck"] }
midir = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gltf = { version = "1", default-features = false, features = ["utils", "names"] }
bytemuck = { version = "1", features = ["derive"] }
axoupdater = { version = "0.10", features = ["blocking"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "default-tls", "blocking"] }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "wgpu", "links", "persistence", "wayland", "x11"] }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-wav", "symphonia-pcm", "symphonia-flac", "symphonia-vorbis", "symphonia-ogg", "symphonia-aac", "symphonia-isomp4"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
