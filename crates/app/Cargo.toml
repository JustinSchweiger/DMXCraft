[package]
name = "lightcraft-app"
description = "Desktop-Oberfläche (egui) für LightCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "lightcraft"
path = "src/main.rs"

[dependencies]
lightcraft-core.workspace = true
lightcraft-output.workspace = true
lightcraft-ofl.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
