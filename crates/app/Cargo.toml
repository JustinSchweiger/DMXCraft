[package]
name = "openlicht-app"
description = "Desktop-Oberfläche (egui) für OpenLicht"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "openlicht"
path = "src/main.rs"

[dependencies]
openlicht-core.workspace = true
openlicht-output.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
